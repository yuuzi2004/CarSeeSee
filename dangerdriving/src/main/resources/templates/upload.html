<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>车辆危险驾驶检测</title>
    <style>
        :root{
            --铜绿: #549688;
            --蒸栗: #f4eac5;
            --铜绿深: #3d6d62;
            --铜绿浅: #7fb3a8;
            --蒸栗深: #e8d4a0;
            --主文字: #2d4b3d;
            --副文字: #5a7a6d;
            --白: #ffffff;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{
            height:100%;
            width:100%;
        }
        body{
            min-height:100vh;
            width:100%;
            font-family:"Segoe UI","Microsoft YaHei",sans-serif;
            background:var(--蒸栗);
            background-image:radial-gradient(ellipse 120% 100% at 50% 0%,
            var(--铜绿) 0%,
            rgba(132,180,170,0.6) 40%,
            rgba(244,234,197,0.8) 70%,
            var(--蒸栗) 100%);
            background-attachment:fixed;
            background-size:100% 100%;
            background-repeat:no-repeat;
            display:flex;
            flex-direction:column;
            position:relative;
            overflow-x:hidden;
        }

        /* 背景装饰动画 */
        body::before{
            content:'';
            position:fixed;
            top:-50%;
            left:-50%;
            width:200%;
            height:200%;
            background:radial-gradient(circle, rgba(84,150,136,0.05) 1px, transparent 1px);
            background-size:50px 50px;
            animation:float 20s infinite linear;
            pointer-events:none;
            z-index:0;
        }
        @keyframes float{
            0%{transform:translate(0,0) rotate(0deg);}
            100%{transform:translate(-50px,-50px) rotate(360deg);}
        }

        /* 导航栏 - 轻快半透明风格 */
        .navbar{
            width:100%;
            background:rgba(255,255,255,0.4);
            backdrop-filter:blur(20px) saturate(180%);
            -webkit-backdrop-filter:blur(20px) saturate(180%);
            border-bottom:1px solid rgba(84,150,136,0.15);
            padding:20px 0;
            box-shadow:0 1px 3px rgba(84,150,136,.08);
            position:sticky;
            top:0;
            z-index:100;
            transition:all 0.3s ease;
        }
        .navbar:hover{
            background:rgba(255,255,255,0.5);
            box-shadow:0 2px 8px rgba(84,150,136,.12);
        }
        .nav-container{
            max-width:1200px;
            margin:0 auto;
            padding:0 30px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .nav-title{
            font-size:22px;
            font-weight:600;
            color:var(--铜绿深);
            letter-spacing:0.5px;
            text-align:center;
            display:flex;
            align-items:center;
            gap:10px;
            position:relative;
        }
        .nav-title::before{
            content:'🚗';
            font-size:24px;
            opacity:0.8;
        }
        .nav-title::after{
            content:'';
            position:absolute;
            bottom:-5px;
            left:50%;
            transform:translateX(-50%);
            width:40px;
            height:2px;
            background:linear-gradient(90deg, transparent, var(--铜绿浅), transparent);
            border-radius:2px;
        }

        /* 主内容区 */
        .main-container{
            flex:1;
            width:100%;
            max-width:1200px;
            margin:0 auto;
            padding:50px 30px;
            position:relative;
            z-index:1;
        }
        .content-section{
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);
            border-radius:20px;
            padding:45px;
            margin-bottom:30px;
            box-shadow:0 8px 32px rgba(84,150,136,.12),
            0 2px 8px rgba(84,150,136,.08);
            border:1px solid rgba(255,255,255,0.5);
            transition:all 0.3s ease;
            position:relative;
            overflow:hidden;
        }
        .content-section::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            height:3px;
            background:linear-gradient(90deg,
            var(--铜绿浅),
            var(--铜绿),
            var(--铜绿浅));
            opacity:0.6;
        }
        .content-section:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 40px rgba(84,150,136,.15),
            0 4px 12px rgba(84,150,136,.1);
        }
        .header{
            text-align:center;
            margin-bottom:45px;
            padding-bottom:35px;
            border-bottom:1px solid rgba(84,150,136,0.12);
            position:relative;
        }
        .header::after{
            content:'';
            position:absolute;
            bottom:-1px;
            left:50%;
            transform:translateX(-50%);
            width:60px;
            height:2px;
            background:linear-gradient(90deg, transparent, var(--铜绿浅), transparent);
            border-radius:2px;
        }
        .header h1{
            font-size:34px;
            letter-spacing:0.5px;
            color:var(--铜绿深);
            margin-bottom:15px;
            font-weight:600;
            text-align:center;
            background:linear-gradient(135deg, var(--铜绿深) 0%, var(--铜绿) 100%);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            position:relative;
        }
        .header p{
            font-size:16px;
            color:var(--副文字);
            line-height:1.6;
            max-width:600px;
            margin:0 auto;
        }

        /* 按钮区：并排 + 完全等大 + 文字居中 */
        .btn-row{
            display:flex;justify-content:center;gap:20px;
            flex-wrap:wrap;
        }
        .btn{
            width:170px;height:48px;border:none;border-radius:24px;
            font-size:16px;font-weight:500;cursor:pointer;transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:0 4px 14px rgba(84,150,136,.18);
            display:flex;align-items:center;justify-content:center;
            position:relative;
            overflow:hidden;
            gap:8px;
        }
        .btn::before{
            content:'';
            position:absolute;
            top:50%;
            left:50%;
            width:0;
            height:0;
            border-radius:50%;
            background:rgba(255,255,255,0.3);
            transform:translate(-50%, -50%);
            transition:width 0.6s, height 0.6s;
        }
        .btn:hover::before{
            width:300px;
            height:300px;
        }
        .btn-primary{
            background:linear-gradient(135deg, var(--铜绿) 0%, var(--铜绿深) 100%);
            color:var(--白);
        }
        .btn-primary:hover{
            background:linear-gradient(135deg, var(--铜绿深) 0%, var(--铜绿) 100%);
            box-shadow:0 8px 20px rgba(84,150,136,.3);
            transform:translateY(-3px) scale(1.02);
        }
        .btn-primary:active{
            transform:translateY(-1px) scale(0.98);
        }
        .btn-secondary{
            background:rgba(255,255,255,0.9);
            color:var(--铜绿深);
            border:2px solid var(--铜绿浅);
            backdrop-filter:blur(10px);
        }
        .btn-secondary:hover{
            background:rgba(244,234,197,0.95);
            border-color:var(--铜绿);
            box-shadow:0 8px 20px rgba(84,150,136,.25);
            transform:translateY(-3px) scale(1.02);
        }
        .btn-secondary:active{
            transform:translateY(-1px) scale(0.98);
        }

        /* 结果区 */
        .result-area{
            display:flex;
            flex-direction:column;
            gap:25px;
        }
        .result-title{
            font-size:20px;
            color:var(--铜绿深);
            font-weight:600;
            margin-bottom:10px;
            text-align:center;
        }
        .result-img-box{
            width:100%;
            min-height:400px;
            border-radius:16px;
            border:2px dashed rgba(84,150,136,0.25);
            background:linear-gradient(135deg,
            rgba(244,234,197,0.15) 0%,
            rgba(255,255,255,0.3) 50%,
            rgba(244,234,197,0.15) 100%);
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            transition:all 0.3s ease;
            position:relative;
        }
        .result-img-box:hover{
            border-color:rgba(84,150,136,0.4);
            background:linear-gradient(135deg,
            rgba(244,234,197,0.2) 0%,
            rgba(255,255,255,0.4) 50%,
            rgba(244,234,197,0.2) 100%);
        }
        .result-img-box img{
            max-width:100%;
            max-height:600px;
            object-fit:contain;
            border-radius:8px;
        }
        .status-tag{
            padding:12px 32px;border-radius:25px;font-size:16px;font-weight:600;
            box-shadow:0 4px 12px rgba(0,0,0,.08);
            display:inline-block;
            margin:0 auto;
            transition:all 0.3s ease;
        }
        .status-tag:hover{
            transform:scale(1.05);
            box-shadow:0 6px 16px rgba(0,0,0,.12);
        }
        .safe{
            background:linear-gradient(135deg, rgba(84,150,136,0.15) 0%, rgba(84,150,136,0.25) 100%);
            color:var(--铜绿深);
            border:2px solid var(--铜绿浅);
        }
        .danger{
            background:linear-gradient(135deg, rgba(220,53,69,0.15) 0%, rgba(220,53,69,0.25) 100%);
            color:#c03545;
            border:2px solid #e85d6d;
        }
        .loading-tag {
            background:linear-gradient(135deg, rgba(84,150,136,0.1) 0%, rgba(84,150,136,0.2) 100%);
            color:var(--铜绿深);
            border:2px solid var(--铜绿);
            padding:12px 32px;
            border-radius:25px;
            font-size:16px;
            font-weight:600;
            box-shadow:0 4px 12px rgba(0,0,0,.08);
            display:inline-block;
            margin:0 auto;
        }
        .msg{
            font-size:16px;
            color:var(--铜绿深);
            margin-top:10px;
            padding:12px 20px;
            background:rgba(244,234,197,0.5);
            border-radius:12px;
            border-left:4px solid var(--铜绿);
            text-align: center; /* 文字居中 */
            max-width: 80%;     /* 限制宽度，视觉更协调 */
            margin-left: auto;  /* 水平居中 */
            margin-right: auto;
        }
        .empty-txt{
            color:var(--副文字);
            font-size:15px;
            text-align:center;
            line-height:1.6;
        }
        
        /* 详细检测结果列表 */
        .detection-list{
            margin-top:25px;
            display:flex;
            flex-direction:column;
            gap:15px;
        }
        .detection-item{
            background:rgba(255,255,255,0.8);
            border-radius:12px;
            padding:18px 20px;
            border-left:4px solid var(--铜绿);
            box-shadow:0 2px 8px rgba(84,150,136,.1);
            transition:all 0.3s ease;
        }
        .detection-item:hover{
            transform:translateX(5px);
            box-shadow:0 4px 12px rgba(84,150,136,.15);
        }
        .detection-item.danger{
            border-left-color:#dc3545;
            background:rgba(220,53,69,0.05);
        }
        .detection-item.danger-level-3{
            border-left-color:#dc3545;
            background:rgba(220,53,69,0.1);
            border-left-width:6px;
        }
        .detection-item.danger-level-2{
            border-left-color:#ff9800;
            background:rgba(255,152,0,0.08);
        }
        .detection-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
        }
        .detection-name{
            font-size:18px;
            font-weight:600;
            color:var(--铜绿深);
            display:flex;
            align-items:center;
            gap:8px;
        }
        .detection-item.danger .detection-name{
            color:#dc3545;
        }
        .detection-confidence{
            font-size:14px;
            color:var(--副文字);
            background:rgba(84,150,136,0.1);
            padding:4px 12px;
            border-radius:12px;
        }
        .detection-item.danger .detection-confidence{
            background:rgba(220,53,69,0.15);
            color:#c03545;
        }
        .detection-description{
            font-size:14px;
            color:var(--副文字);
            line-height:1.6;
            margin-top:8px;
            padding:10px;
            background:rgba(244,234,197,0.3);
            border-radius:8px;
        }
        .detection-item.danger .detection-description{
            background:rgba(220,53,69,0.08);
            color:#5a7a6d;
        }
        .detection-info{
            display:flex;
            gap:15px;
            margin-top:10px;
            font-size:13px;
            color:var(--副文字);
        }
        .detection-info-item{
            display:flex;
            align-items:center;
            gap:5px;
        }
        .detection-info-label{
            font-weight:500;
        }
        .no-detections{
            text-align:center;
            padding:30px;
            color:var(--副文字);
            font-size:15px;
        }

        /* 已选择文件提示 */
        .file-selected {
            margin-top: 20px;
            text-align: center;
            color: var(--铜绿深);
            font-size: 15px;
            padding: 10px;
            background: rgba(84,150,136,0.08);
            border-radius: 12px;
            display: none;
        }
        
        /* 可检测行为列表 */
        .detectable-behaviors{
            margin-top:30px;
            padding-top:30px;
            border-top:2px solid rgba(84,150,136,0.2);
        }
        .behaviors-title{
            font-size:18px;
            font-weight:600;
            color:var(--铜绿深);
            margin-bottom:20px;
            text-align:center;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
        }
        .behaviors-title::before{
            content:'🔍';
            font-size:20px;
        }
        .behaviors-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
            gap:12px;
            margin-top:15px;
        }
        .behavior-item{
            background:rgba(255,255,255,0.8);
            padding:12px 16px;
            border-radius:10px;
            border-left:3px solid var(--铜绿);
            font-size:14px;
            color:var(--铜绿深);
            transition:all 0.3s ease;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .behavior-item:hover{
            transform:translateX(5px);
            box-shadow:0 4px 12px rgba(84,150,136,.15);
            background:rgba(255,255,255,0.95);
        }
        .behavior-item.danger{
            border-left-color:#dc3545;
            background:rgba(220,53,69,0.08);
        }
        .behavior-item.safe{
            border-left-color:var(--铜绿);
        }
        .behavior-icon{
            font-size:16px;
        }

        /* 加载动画 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(84,150,136,0.3);
            border-radius: 50%;
            border-top-color: var(--铜绿深);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-container{
                padding:20px 15px;
            }
            .content-section{
                padding:25px 20px;
            }
            .nav-container{
                padding:0 20px;
            }
            .nav-title{
                font-size:18px;
            }
            .nav-title::before{
                font-size:20px;
            }
            .header h1{
                font-size:24px;
            }
            .header p{
                font-size:14px;
            }
            .btn-row{
                flex-direction:column;
                align-items:stretch;
            }
            .btn{
                width:100%;
            }
            .result-img-box{
                min-height:300px;
            }
            .behaviors-grid{
                grid-template-columns:1fr;
            }
            .behaviors-title{
                font-size:16px;
            }
        }
    </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar">
    <div class="nav-container">
        <div class="nav-title">车辆危险驾驶检测系统</div>
    </div>
</nav>

<!-- 主内容区 -->
<main class="main-container">
    <div class="content-section">
        <div class="header">
            <h1>车辆危险驾驶检测</h1>
            <p>上传图片 / 视频，自动识别危险驾驶行为并框选危险区域</p>
        </div>

        <form id="detectForm" method="post" enctype="multipart/form-data" action="/detect">
            <div class="btn-row">
                <!-- 隐藏原生 input，用 label 当按钮 -->
                <input type="file" id="fileInput" name="file" accept="image/*,video/*" required style="display:none;"/>
                <label for="fileInput" class="btn btn-secondary">选择文件</label>
                <button type="submit" class="btn btn-primary">开始检测</button>
            </div>
            <!-- 已选择文件提示 -->
            <div id="fileSelected" class="file-selected">
                <span>已选择：</span><span id="fileName"></span>
            </div>
        </form>
    </div>

    <div class="content-section">
        <div class="result-area">
            <div class="result-title">检测结果</div>
            <div class="result-img-box" id="resultImgBox">
                <!-- 预览图 -->
                <img id="previewImg" src="" alt="预览图片" style="display:none; max-width:100%; max-height:600px; object-fit:contain;"/>
                <!-- 检测结果图 -->
                <img th:if="${detectionImage}" th:src="${detectionImage}" id="detectionImg" alt="检测结果" style="max-width:100%; max-height:600px; object-fit:contain;"/>
                <!-- 空状态提示 -->
                <div id="emptyState" class="empty-txt" th:unless="${detectionImage}">检测结果图片将在此处显示<br/>危险区域会被自动框选标注</div>
            </div>

            <!-- 状态标签 -->
            <div id="loadingTag" class="loading-tag" style="display:none;">
                <span class="loading-icon"></span>正在检测中，请稍候...
            </div>
            <div th:if="${safetyStatus == 'safe'}" id="safeTag" class="status-tag safe">✅ 检测安全 - 未发现危险驾驶行为</div>
            <div th:if="${safetyStatus == 'danger'}" id="dangerTag" class="status-tag danger">⚠️ 检测危险 - 发现危险驾驶行为</div>
            <div th:unless="${safetyStatus}" id="statusPlaceholder" style="height:50px;"></div>

            <!-- 消息提示 -->
            <div class="msg" th:if="${msg}" id="msgBox">[[${msg}]]</div>
            <div th:unless="${msg}" id="emptyMsg" class="empty-txt">请上传文件并点击检测按钮开始分析</div>
            
            <!-- 详细检测结果列表 -->
            <div th:if="${detections != null and !detections.isEmpty()}" class="detection-list">
                <div style="font-size:18px;font-weight:600;color:var(--铜绿深);margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid rgba(84,150,136,0.2);">
                    📋 详细检测结果
                    <span th:if="${dangerCount != null and dangerCount > 0}" style="color:#dc3545;font-size:16px;margin-left:10px;">
                        (发现 <span th:text="${dangerCount}">0</span> 个危险行为)
                    </span>
                </div>
                <div th:each="detection : ${detections}" 
                     th:classappend="${detection.isDangerous} ? 'danger danger-level-' + ${detection.dangerLevel} : ''"
                     class="detection-item">
                    <div class="detection-header">
                        <div class="detection-name">
                            <span th:if="${detection.isDangerous}">⚠️</span>
                            <span th:unless="${detection.isDangerous}">✅</span>
                            <span th:text="${detection.chineseName}">行为名称</span>
                        </div>
                        <div class="detection-confidence">
                            置信度: <span th:text="${#numbers.formatDecimal(detection.confidence, 1, 2)}">0.00</span>
                        </div>
                    </div>
                    <div class="detection-description" th:text="${detection.description}">
                        行为描述
                    </div>
                    <div class="detection-info" th:if="${detection.bbox != null}">
                        <div class="detection-info-item">
                            <span class="detection-info-label">位置:</span>
                            <span>X: <span th:text="${#numbers.formatDecimal(detection.bbox.x1, 1, 0)}">0</span> - <span th:text="${#numbers.formatDecimal(detection.bbox.x2, 1, 0)}">0</span></span>
                        </div>
                        <div class="detection-info-item">
                            <span>Y: <span th:text="${#numbers.formatDecimal(detection.bbox.y1, 1, 0)}">0</span> - <span th:text="${#numbers.formatDecimal(detection.bbox.y2, 1, 0)}">0</span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${detections == null or detections.isEmpty()}" class="no-detections">
                暂无检测结果
            </div>
        </div>
    </div>
</main>
<script>
    // 获取DOM元素
    const fileInput = document.getElementById('fileInput');
    const fileSelected = document.getElementById('fileSelected');
    const fileName = document.getElementById('fileName');
    const previewImg = document.getElementById('previewImg');
    const detectionImg = document.getElementById('detectionImg');
    const emptyState = document.getElementById('emptyState');
    const resultImgBox = document.getElementById('resultImgBox');
    const detectForm = document.getElementById('detectForm');
    const loadingTag = document.getElementById('loadingTag');
    const safeTag = document.getElementById('safeTag');
    const dangerTag = document.getElementById('dangerTag');
    const statusPlaceholder = document.getElementById('statusPlaceholder');
    const msgBox = document.getElementById('msgBox');
    const emptyMsg = document.getElementById('emptyMsg');

    // 初始化状态
    function initState() {
        // 隐藏所有状态标签
        if (loadingTag) loadingTag.style.display = 'none';
        if (safeTag) safeTag.style.display = 'none';
        if (dangerTag) dangerTag.style.display = 'none';
        if (statusPlaceholder) statusPlaceholder.style.display = 'block';

        // 隐藏消息
        if (msgBox) msgBox.style.display = 'none';
        if (emptyMsg) emptyMsg.style.display = 'block';
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        initState();

        // 检查是否有检测结果图（Thymeleaf已经渲染了，只需要显示）
        if (detectionImg && detectionImg.src && detectionImg.src.trim() !== '' && detectionImg.src !== window.location.href) {
            previewImg.style.display = 'none';
            detectionImg.style.display = 'block';
            if (emptyState) emptyState.style.display = 'none';

            // 显示对应的状态标签
            if (safeTag && safeTag.textContent) safeTag.style.display = 'inline-block';
            if (dangerTag && dangerTag.textContent) dangerTag.style.display = 'inline-block';
            if (statusPlaceholder) statusPlaceholder.style.display = 'none';

            // 显示消息
            if (msgBox && msgBox.textContent) {
                msgBox.style.display = 'block';
                if (emptyMsg) emptyMsg.style.display = 'none';
            }
        } else {
            // 没有检测结果，确保检测结果图隐藏
            if (detectionImg) detectionImg.style.display = 'none';
        }
    });

    // 文件选择事件
    fileInput.addEventListener('change', function(e) {
        const file = this.files[0];
        if (file) {
            // 显示已选择文件提示
            fileSelected.style.display = 'block';
            fileName.textContent = file.name;

            // 如果是图片文件，显示预览
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                    previewImg.style.display = 'block';
                    // 隐藏检测结果图和空状态
                    if (detectionImg) detectionImg.style.display = 'none';
                    emptyState.style.display = 'none';
                };
                reader.readAsDataURL(file);
            } else {
                // 非图片文件（视频），只显示文件名
                previewImg.style.display = 'none';
                if (detectionImg) detectionImg.style.display = 'none';
                emptyState.textContent = `已选择视频文件：${file.name}\n点击检测按钮开始分析`;
                emptyState.style.display = 'block';
            }

            // 重置状态
            initState();
        } else {
            // 未选择文件
            fileSelected.style.display = 'none';
            previewImg.style.display = 'none';
            if (detectionImg) detectionImg.style.display = 'none';
            emptyState.textContent = '检测结果图片将在此处显示\n危险区域会被自动框选标注';
            emptyState.style.display = 'block';
        }
    });

    // 表单提交事件
    detectForm.addEventListener('submit', function(e) {
        const file = fileInput.files[0];
        if (!file) {
            e.preventDefault();
            alert('请先选择要检测的文件！');
            return;
        }

        // 显示加载状态
        loadingTag.style.display = 'inline-block';
        if (safeTag) safeTag.style.display = 'none';
        if (dangerTag) dangerTag.style.display = 'none';
        if (statusPlaceholder) statusPlaceholder.style.display = 'none';

        // 禁用提交按钮防止重复提交
        const submitBtn = this.querySelector('.btn-primary');
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.7';
        submitBtn.innerHTML = '<span class="loading-icon"></span>检测中...';
    });
</script>
</body>
</html>
